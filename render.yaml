services:
  - type: web
    name: fonde44
    runtime: node
    plan: free
    region: frankfurt
    branch: release/1.0.0-rc1
    autoDeploy: true
    # Inclure les dépendances de développement : Vite est nécessaire au build même avec NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/bootstrap-db.mjs && node server/local.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fonde44-db
          property: connectionString
      - key: ORDER_TRACKING_SECRET
        generateValue: true
      - key: SUBSCRIPTIONS_CRON_SECRET
        generateValue: true
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: S3_AUTO_CREATE_BUCKET
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # VITE_GOOGLE_CLIENT_ID est lue à la construction : la renseigner avant le build qui active Google.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: OM_MERCHANT_CODE
        sync: false
      - key: OM_CLIENT_ID
        sync: false
      - key: OM_CLIENT_SECRET
        sync: false
      - key: OM_WEBHOOK_SECRET
        sync: false
      - key: OM_SITENAME
        sync: false

databases:
  - name: fonde44-db
    plan: free
    region: frankfurt
