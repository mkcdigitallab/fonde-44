services:
  postgres:
    image: postgres:16-alpine
    container_name: fonde44-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fonde44
      POSTGRES_USER: fonde44
      POSTGRES_PASSWORD: fonde44
    ports:
      - "5433:5432"
    volumes:
      - fonde44_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fonde44 -d fonde44"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    container_name: fonde44-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fonde44
      MINIO_ROOT_PASSWORD: fonde44minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fonde44_minio_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fonde44-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://fonde44:fonde44@postgres:5432/fonde44
      VITE_WHATSAPP_PHONE: ${VITE_WHATSAPP_PHONE:-}
      MEDIA_DIR: /app/storage/media
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: fonde44
      MINIO_SECRET_KEY: fonde44minio
      MINIO_BUCKET: fonde44
    ports:
      - "3000:3000"
    volumes:
      - fonde44_media:/app/storage/media

volumes:
  fonde44_postgres_data:
  fonde44_media:
  fonde44_minio_data:
