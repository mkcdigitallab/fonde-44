name: CI
on:
  push:
    branches: ["main", "feat/**", "chore/**", "fix/**"]
  pull_request:
    branches: ["main", "feat/mere-fonde-dashboard", "chore/26-docker-local-stack"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
