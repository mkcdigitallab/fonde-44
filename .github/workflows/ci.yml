name: CI
on:
  push:
    branches: ["main", "feat/**", "chore/**", "fix/**"]
  pull_request:
    branches: ["main", "feat/mere-fonde-dashboard", "chore/26-docker-local-stack"]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fonde44
          POSTGRES_USER: fonde44
          POSTGRES_PASSWORD: fonde44
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fonde44 -d fonde44"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://fonde44:fonde44@localhost:5432/fonde44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Validate PostgreSQL schema
        run: PGPASSWORD=fonde44 psql -h localhost -U fonde44 -d fonde44 -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Validate database migration
        run: node server/migrate.mjs
